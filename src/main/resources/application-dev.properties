# Perfil dev: MySQL do Docker Compose.
# As credenciais vêm de variáveis de ambiente (arquivo .env, que não é versionado).
spring.datasource.url=jdbc:mysql://localhost:3307/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Nesta fase o Hibernate não mexe no esquema e o Flyway ainda está desligado.
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=false

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
