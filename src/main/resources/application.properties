spring.application.name=pedidos

# Lê o arquivo .env (não versionado) da raiz do projeto, se existir.
# É dele que vêm DB_NAME, DB_USER e DB_PASSWORD, em qualquer forma de executar.
spring.config.import=optional:file:.env[.properties]

# Configuração padrão (todos os perfis): MySQL do Docker Compose.
# O perfil "test" sobrescreve isso com H2 em memória (application-test.properties).
spring.datasource.url=jdbc:mysql://localhost:3307/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# O esquema é criado pelo Flyway (src/main/resources/db/migration);
# o Hibernate só valida se as entidades combinam com as tabelas.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
